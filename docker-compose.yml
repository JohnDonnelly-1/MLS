services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # Mount the entire project directory for live editing
      - .:/app
      # Don't mount these directories (use container versions)
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/staticfiles
    ports:
      - "8432:8000"
    environment:
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=mls.settings
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
