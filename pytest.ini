[pytest]
DJANGO_SETTINGS_MODULE = mls.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Register custom markers to avoid warnings
markers =
    unit: Unit tests - test individual components in isolation
    integration: Integration tests - test interactions between components
    functional: Functional tests - test complete features end-to-end
    acceptance: Acceptance tests - test business requirements
    performance: Performance tests - test speed and efficiency
    slow: Tests that take a long time to run
    db: Tests that require database access

# Test output options
addopts =
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage settings
[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
