{% extends "mls_core/base.html" %}

{% block title %}Edit Security Label{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Security Label: {{ label.name }}</h2>

    <p><a href="{% url 'mls_core:label_list' %}" class="btn btn-secondary">Back to List</a></p>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="short_code">Short Code *</label>
            <input type="text" id="short_code" name="short_code" required maxlength="10" value="{{ label.short_code }}">
        </div>

        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required maxlength="100" value="{{ label.name }}">
        </div>

        <div class="form-group">
            <label for="label_type">Type *</label>
            <select id="label_type" name="label_type" required>
                {% for value, display in label_types %}
                    <option value="{{ value }}" {% if label.label_type == value %}selected{% endif %}>{{ display }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="rank">Rank</label>
            <input type="number" id="rank" name="rank" value="{{ label.rank }}" min="0">
        </div>

        <div class="form-group">
            <label for="color">Color</label>
            <input type="color" id="color" name="color" value="{{ label.color }}">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ label.description }}</textarea>
        </div>

        <button type="submit" class="btn">Save Changes</button>
        <a href="{% url 'mls_core:label_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
