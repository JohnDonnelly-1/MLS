{% extends "mls_core/base.html" %}

{% block title %}Create DAC Group{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create DAC Group</h1>
    <a href="{% url 'mls_core:dac_group_list' %}" class="btn btn-secondary btn-sm">Back to List</a>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required maxlength="100" placeholder="e.g., Engineering, Management">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>Parent Groups <small style="display:inline;">(optional &mdash; for inheritance)</small></label>
            {% if all_groups %}
            <div class="picker-grid">
                {% for group in all_groups %}
                    <label class="picker-option">
                        <input type="checkbox" name="parent_groups" value="{{ group.id }}">
                        {{ group.name }}
                    </label>
                {% endfor %}
            </div>
            {% else %}
                <p class="mls-user">No existing groups to inherit from.</p>
            {% endif %}
        </div>

        <div class="btn-group">
            <button type="submit" class="btn">Create DAC Group</button>
            <a href="{% url 'mls_core:dac_group_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
